[project]
name = "ceres-chat"
version = "0.1.0"
description = "A chat page for testing the Ceres service (/v1/ask) — a test tool, v0"
license = { text = "proprietary" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceres_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
